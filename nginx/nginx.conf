server {
  listen 80;
  server_name _;

  # (opcional) gzip/headers aqui…

  # WebSocket do Socket.IO
  location /socket.io/ {
    proxy_pass http://izing-backend:9000/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # API
  location /api/ {
    proxy_pass http://izing-backend:9000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
  }

  # Front estático (ajuste o root conforme a tua imagem do nginx)
  location / {
    try_files $uri $uri/ /index.html;
    root /usr/share/nginx/html;
    index index.html;
  }

  # DNS do Docker p/ resolver service names
  resolver 127.0.0.11 ipv6=off valid=30s;
}
